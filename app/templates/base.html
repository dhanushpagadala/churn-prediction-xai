<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Retention Control{% endblock %}</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#141b24;
    --panel-2:#1a2330;
    --line:#263140;
    --text:#e7edf3;
    --muted:#8ba0b5;
    --accent:#4c8dff;
    --high:#f0554a;
    --med:#e0a527;
    --low:#39c07a;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", "Inter", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14.5px;
  }
  a{color:inherit; text-decoration:none;}
  .shell{display:flex; min-height:100vh;}
  nav.side{
    width:200px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); padding:24px 0;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    font-family:var(--mono); font-size:13px; letter-spacing:0.08em;
    color:var(--muted); padding:0 22px 22px 22px; text-transform:uppercase;
    border-bottom:1px solid var(--line); margin-bottom:14px;
  }
  .brand strong{display:block; color:var(--text); font-size:16px; letter-spacing:0; margin-bottom:4px;}
  nav.side a{
    display:block; padding:10px 22px; color:var(--muted); font-size:13.5px;
    border-left:2px solid transparent;
  }
  nav.side a:hover{color:var(--text); background:var(--panel-2);}
  nav.side a.active{color:var(--text); border-left:2px solid var(--accent); background:var(--panel-2);}
  main{flex:1; padding:28px 36px; max-width:1200px;}
  h1{font-size:20px; margin:0 0 4px 0; font-weight:600;}
  h2{font-size:15px; margin:0 0 14px 0; font-weight:600; color:var(--text);}
  .subtitle{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .kpi-row{display:flex; gap:14px; margin-bottom:26px; flex-wrap:wrap;}
  .kpi{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 18px; min-width:150px; flex:1;
  }
  .kpi .val{font-family:var(--mono); font-size:22px; font-weight:600;}
  .kpi .lbl{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:20px 22px; margin-bottom:22px;
  }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; color:var(--muted); font-weight:500; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  td{padding:9px 10px; border-bottom:1px solid #1b2330; font-family:var(--mono); font-size:13px;}
  tr:hover td{background:var(--panel-2);}
  .badge{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px;
    font-family:var(--mono); font-weight:600; letter-spacing:0.02em;
  }
  .badge.High{background:rgba(240,85,74,0.15); color:var(--high); border:1px solid rgba(240,85,74,0.4);}
  .badge.Medium{background:rgba(224,165,39,0.15); color:var(--med); border:1px solid rgba(224,165,39,0.4);}
  .badge.Low{background:rgba(57,192,122,0.15); color:var(--low); border:1px solid rgba(57,192,122,0.4);}
  .bar-bg{background:#1b2330; border-radius:3px; height:6px; width:70px; overflow:hidden; display:inline-block; vertical-align:middle;}
  .bar-fill{height:100%; border-radius:3px; display:block;}
  .filters{display:flex; gap:10px; margin-bottom:18px; align-items:center; flex-wrap:wrap;}
  input[type=text], select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 12px; border-radius:6px; font-size:13px; font-family:var(--sans);
  }
  .pill-group a{
    padding:6px 13px; border-radius:6px; border:1px solid var(--line); font-size:12.5px;
    color:var(--muted); margin-right:6px; display:inline-block;
  }
  .pill-group a.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .back{color:var(--accent); font-size:13px; margin-bottom:16px; display:inline-block;}
  .grid-2{display:grid; grid-template-columns:1.1fr 1fr; gap:22px;}
  img.chart{width:100%; border-radius:6px; background:#fff; padding:6px;}
  .driver-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #1b2330; font-size:13px;}
  .driver-row .name{color:var(--text);}
  .driver-row .val{font-family:var(--mono); color:var(--muted); font-size:12px;}
  .tag-up{color:var(--high); font-family:var(--mono); font-size:12px;}
  .tag-down{color:var(--low); font-family:var(--mono); font-size:12px;}
  .action-card{
    border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px;
    background:var(--panel-2);
  }
  .action-card .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .action-card .title{font-weight:600; font-size:13.5px;}
  .cost{font-family:var(--mono); color:var(--muted); font-size:12px;}
  .rationale{color:var(--muted); font-size:12.5px; line-height:1.5;}
  .driver-tag{font-family:var(--mono); font-size:11px; color:var(--accent); margin-top:6px; display:inline-block;}
  .prob-big{font-family:var(--mono); font-size:44px; font-weight:700;}
  .footer-note{color:var(--muted); font-size:11.5px; margin-top:30px; line-height:1.6; border-top:1px solid var(--line); padding-top:14px;}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand"><strong>Retention Control</strong>churn xai v1</div>
    <a href="/" class="{% block navhome %}{% endblock %}">Customers</a>
    <a href="/overview" class="{% block navoverview %}{% endblock %}">Model &amp; Drivers</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
